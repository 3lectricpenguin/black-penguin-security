<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer cyber hexagon shield -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round" fill="#0a0b10"/>
  <!-- Stylized penguin body -->
  <path d="M50,20 L75,45 L75,75 L50,90 L25,75 L25,45 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner chest (white belly arch) -->
  <path d="M50,50 L65,70 L50,85 L35,70 Z" fill="rgba(0, 210, 255, 0.2)" stroke="#00d2ff" stroke-width="3" stroke-linejoin="round"/>
  <!-- Beak -->
  <polygon points="50,42 55,33 45,33" fill="#00d2ff"/>
  <!-- Glowing eyes -->
  <circle cx="40" cy="27" r="2.5" fill="#ffffff"/>
  <circle cx="60" cy="27" r="2.5" fill="#ffffff"/>
</svg>
